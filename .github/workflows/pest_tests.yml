name: Pest Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Pest Tests (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            connection: mysql
            port: 3306
            username: root
            password: root
          - db: mariadb
            connection: mariadb
            port: 3307
            username: root
            password: root
          - db: pgsql
            connection: pgsql
            port: 5432
            username: unopim
            password: unopim

    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unopim
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mariadb:
        image: ${{ matrix.db == 'mariadb' && 'mariadb:11.8' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: unopim
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      pgsql:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: unopim
          POSTGRES_PASSWORD: unopim
          POSTGRES_DB: unopim
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unopim"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout MCP
        uses: actions/checkout@v5
        with:
          path: mcp-package

      - name: Resolve latest UnoPim release
        id: unopim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/unopim/unopim/releases/latest --jq .tag_name)
          test -n "$tag"
          echo "Testing against UnoPim $tag"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout UnoPim
        uses: actions/checkout@v5
        with:
          repository: unopim/unopim
          ref: ${{ steps.unopim.outputs.ref }}
          path: unopim

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Copy MCP into UnoPim packages
        run: |
          mkdir -p unopim/packages/Webkul/MCP
          cp -r mcp-package/src unopim/packages/Webkul/MCP/src
          cp -r mcp-package/tests unopim/packages/Webkul/MCP/tests
          cp mcp-package/composer.json unopim/packages/Webkul/MCP/composer.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: |
            unopim/vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mcp-${{ hashFiles('unopim/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-mcp-

      - name: Install base dependencies
        working-directory: unopim
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Register MCP as a path repository and require it
        working-directory: unopim
        run: |
          composer config repositories.mcp '{"type":"path","url":"packages/Webkul/MCP","options":{"symlink":true}}' --json
          composer require unopim/mcp:"*@dev" --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Register MCP test namespace in root autoload-dev
        working-directory: unopim
        run: |
          php -r "
            \$json = json_decode(file_get_contents('composer.json'), true);
            \$json['autoload-dev']['psr-4']['Webkul\\\\MCP\\\\Tests\\\\'] = 'packages/Webkul/MCP/tests/';
            file_put_contents('composer.json', json_encode(\$json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          "
          composer dump-autoload --optimize

      - name: Add MCP test suite to phpunit.xml
        working-directory: unopim
        run: |
          sed -i '/<\/testsuites>/i\
              <testsuite name="MCP Unit">\
                  <directory suffix="Test.php">packages/Webkul/MCP/tests/Unit</directory>\
              </testsuite>\
              <testsuite name="MCP Feature">\
                  <directory suffix="Test.php">packages/Webkul/MCP/tests/Feature</directory>\
              </testsuite>' phpunit.xml

      - name: Register MCP test case in Pest.php
        working-directory: unopim
        run: |
          sed -i '/^use Webkul\\Category\\Tests\\CategoryTestCase;/a use Webkul\\MCP\\Tests\\MCPTestCase;' tests/Pest.php
          sed -i '/^uses(CategoryTestCase::class)/a uses(MCPTestCase::class)->in('\''../packages/Webkul/MCP/tests'\'');' tests/Pest.php

      - name: Setting Environment
        working-directory: unopim
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1${{ matrix.connection }}|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ matrix.port }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1unopim|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1${{ matrix.username }}|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1${{ matrix.password }}|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1wk_|" .env
          sed -i "s|^\(ELASTICSEARCH_ENABLED=\s*\).*$|\1false|" .env

      - name: Running UnoPim Installer
        working-directory: unopim
        run: php artisan unopim:install --skip-env-check --skip-admin-creation --with-demo-data --no-interaction

      - name: Running Pest Tests (MCP Unit)
        working-directory: unopim
        run: vendor/bin/pest --colors=always --testsuite="MCP Unit"

      - name: Running Pest Tests (MCP Feature)
        working-directory: unopim
        run: vendor/bin/pest --colors=always --testsuite="MCP Feature"

      - name: Running Static Analysis
        if: matrix.db == 'mysql'
        working-directory: unopim
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G --no-progress packages/Webkul/MCP/src
