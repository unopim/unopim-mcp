name: 💡 Feature request
description: Have a new idea, tool or feature? Share it with our team!
title: '[Feature]: '
labels: ['enhancement']

body:
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched the [existing issues](https://github.com/unopim/unopim-mcp/issues?q=) and this feature has not already been requested.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of the problem. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: If this is a new tool, describe its name, arguments and the UnoPim permission it should require.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: extrainfo
    attributes:
      label: Additional Context
    validations:
      required: false
